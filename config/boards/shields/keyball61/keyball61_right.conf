# Right half = peripheral. It reads the trackball and forwards samples to the central
# half through zmk,input-split. There is no keymap here, so nothing layer-dependent
# may be configured here.

CONFIG_SPI=y
CONFIG_INPUT=y

# Required on BOTH halves: ZMK_INPUT_SPLIT sits inside `if ZMK_POINTING` in ZMK's
# app/src/pointing/Kconfig, so omitting this on the right disables the relay.
CONFIG_ZMK_POINTING=y

# badjeff/zmk-pmw3610-driver @ zmk-0.3 uses the symbol PMW3610, not PMW3610_ALT.
CONFIG_PMW3610=y

CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_PM_DEVICE=y

# Upstream's CONFIG_ZMK_MOUSE and every CONFIG_PMW3610_* tuning symbol are gone:
# CPI and orientation became devicetree properties, and automouse/scroll/snipe became
# input-processors on the left half. See docs/TUNING.md for the mapping.
