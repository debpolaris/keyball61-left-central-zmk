# Left half = central (main). It owns the BLE link to the host, the keymap, ZMK
# Studio over USB, and every input processor that interprets trackball motion.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Studio only runs on the central half, so the studio-rpc-usb-uart snippet belongs to
# the left build in build.yaml.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
